<span class="font-label-sm text-label-sm text-outline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">cloud_upload</span> Шинэчлэгдсэн: Өнөөдөр
                </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                React бүрэлдэхүүн хэсэг (component) анх дэлгэцэнд зурагдах үед гадаад серверийн REST API-аас мэдээлэл дуудахад бид <code class="bg-surface-container px-1.5 py-0.5 rounded font-mono text-sm text-primary">useEffect</code> hook-ийг өргөнөөр ашигладаг. Гэвч хүсэлтийн хариу хэзээ ирэхээс шалтгаалан бүрэлдэхүүн аль хэдийн unmount хийгдсэн үед санах ойн алдагдал (Memory leak) болон Race condition үүсэх эрсдэлтэй.
              </p>
<!-- Infobox callout -->
<div class="p-space-md rounded-xl bg-surface-container-high flex items-start gap-space-md">
<span class="material-symbols-outlined text-primary text-[24px] mt-0.5">tips_and_updates</span>
<div class="space-y-1">
<p class="font-label-lg text-label-lg text-on-surface font-bold">Алтан зарчим (Golden Rule):</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Dependency array <code class="font-mono text-xs bg-surface-container px-1 py-0.5 rounded">[userId]</code> дотор тухайн effect дотор дуудагдаж буй бүх динамик хувьсагчдыг үнэн зөв дамжуулах, мөн цэвэрлэх функц (cleanup callback)-ийг тогтмол буцааж хэвшээрэй.
                  </p>
</div>
</div>
<!-- Interactive Code Snippet Preview -->
<div class="rounded-xl bg-inverse-surface text-slate-100 overflow-hidden shadow-md">
<div class="flex items-center justify-between px-space-md py-2 bg-slate-900 text-xs font-mono">
<span class="text-outline-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed-dim">check_circle</span>

<button class="text-slate-400 hover:text-white flex items-center gap-1 transition-colors" onclick="alert('Код хуулагдлаа!')" type="button">

                  </button>

<div class="p-space-md font-mono text-xs sm:text-sm overflow-x-auto space-y-1">
<p><span class="text-purple-400">useEffect</span>(() =&gt; {</p>
<p class="pl-4"><span class="text-blue-400">const</span> controller = <span class="text-blue-400">new</span> <span class="text-yellow-300">AbortController</span>();</p>
<p class="pl-4"><span class="text-blue-400">async function</span> <span class="text-yellow-300">loadPost</span>() {</p>
<p class="pl-8"><span class="text-purple-400">try</span> {</p>
<p class="pl-12"><span class="text-blue-400">const</span> res = <span class="text-purple-400">await</span> <span class="text-yellow-300">fetch</span>(<span class="text-emerald-300">`/api/users/${id}`</span>, { signal: controller.signal });</p>
<p class="pl-12"><span class="text-blue-400">const</span> json = <span class="text-purple-400">await</span> res.<span class="text-yellow-300">json</span>();</p>
<p class="pl-12"><span class="text-yellow-300">setData</span>(json);</p>
<p class="pl-8">} <span class="text-purple-400">catch</span> (err) {</p>
<p class="pl-12"><span class="text-purple-400">if</span> (err.name !== <span class="text-emerald-300">'AbortError'</span>) <span class="text-yellow-300">setError</span>(err);</p>
<p class="pl-8">}</p>
<p class="pl-4">}</p>
<p class="pl-4"><span class="text-yellow-300">loadPost</span>();</p>
<p class="pl-4 text-emerald-400">// Clean-up: Хэрэв id өөрчлөгдвөл өмнөх хүсэлтийг цуцална</p>
<p class="pl-4"><span class="text-purple-400">return</span> () =&gt; controller.<span class="text-yellow-300">abort</span>();</p>
<p>}, [id]);</p>
</div>
